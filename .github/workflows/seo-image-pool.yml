# Keeps scripts/seo/_images/ stocked with pre-verified, commercially-usable
# CC images (Wikimedia Commons), one file per SEO focus area. The weekly SEO
# content routine picks hero + social images from this committed pool — its
# sandbox can't reach image hosts directly (egress policy).
#
# Runs Mondays 01:10 UTC (after the CMS snapshot, before the 02:30 routine) and
# on demand.
name: SEO image pool

on:
  schedule:
    - cron: '10 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-image-pool
  cancel-in-progress: false

jobs:
  pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild image pool
        run: node scripts/seo/build-image-pool.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- scripts/seo/_images; then
            echo "image pool unchanged"
            exit 0
          fi
          git config user.name  "trainzilla-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add scripts/seo/_images
          git commit -m "chore(seo): refresh image pool"
          git push
